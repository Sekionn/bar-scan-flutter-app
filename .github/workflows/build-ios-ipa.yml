name: Build iOS Release IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build signed release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release tag matches pubspec version
        if: github.ref_type == 'tag'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          RELEASE_TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$RELEASE_TAG" ]; then
            echo "Release tag v$RELEASE_TAG does not match pubspec version $APP_VERSION."
            exit 1
          fi
      - name: Create Dart define file
        run: |
          mkdir -p env
          cat > env/ci.json <<EOF
          {
            "BACKEND_BASE_URL": "${{ secrets.BACKEND_BASE_URL }}",
            "RABBITMQ_HOST": "${{ secrets.RABBITMQ_HOST }}",
            "RABBITMQ_PORT": ${{ secrets.RABBITMQ_PORT }},
            "RABBITMQ_USERNAME": "${{ secrets.RABBITMQ_USERNAME }}",
            "RABBITMQ_PASSWORD": "${{ secrets.RABBITMQ_PASSWORD }}",
            "PRODUCT_CREATED_EXCHANGE": "${{ secrets.PRODUCT_CREATED_EXCHANGE }}",
            "PRODUCT_CREATED_QUEUE": "${{ secrets.PRODUCT_CREATED_QUEUE }}",
            "PRODUCT_CREATED_ROUTING_KEY": "${{ secrets.PRODUCT_CREATED_ROUTING_KEY }}"
          }
          EOF

      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install Apple provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PROFILE_PLIST=$RUNNER_TEMP/build_pp.plist
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Create export options
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ secrets.IOS_EXPORT_METHOD }}</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.IOS_BUNDLE_IDENTIFIER }}</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build IPA
        run: >
          flutter build ipa
          --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=env/ci.json
          --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: barscan-ios-ipa
          path: build/ios/ipa/*.ipa





