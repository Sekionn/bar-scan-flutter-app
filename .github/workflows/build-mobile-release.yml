name: Build Mobile Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - pubspec.yaml

permissions:
  contents: write

env:
  DART_DEFINE_FILE: env/ci.json

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate version
        id: version
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          def read_version(text):
              match = re.search(r'^version:\s*([^\s]+)', text, re.MULTILINE)
              if not match:
                  raise SystemExit('No version found in pubspec.yaml.')
              return match.group(1)

          def comparable(version):
              name, _, build = version.partition('+')
              parts = tuple(int(part) for part in name.split('.'))
              build_number = int(build) if build.isdigit() else 0
              return (*parts, build_number)

          current = read_version(open('pubspec.yaml', encoding='utf-8').read())
          current_name = current.split('+', 1)[0]
          ref_type = os.environ['GITHUB_REF_TYPE']
          ref_name = os.environ['GITHUB_REF_NAME']

          if ref_type == 'tag':
              release_name = ref_name[1:] if ref_name.startswith('v') else ref_name
              if release_name != current_name:
                  print(f'Release tag {ref_name} does not match pubspec version {current_name}.')
                  sys.exit(1)
          elif ref_type == 'branch':
              previous_text = subprocess.check_output(['git', 'show', 'HEAD^:pubspec.yaml'], text=True)
              previous = read_version(previous_text)
              if comparable(current) <= comparable(previous):
                  print(f'pubspec.yaml version must increase for a release build. Previous: {previous}, current: {current}.')
                  sys.exit(1)
              print(f'pubspec.yaml version increased from {previous} to {current}.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'app_version={current}\n')
              output.write(f'release_tag=v{current_name}\n')
          PY

  build-android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Dart define file
        run: |
          mkdir -p env
          cat > $DART_DEFINE_FILE <<EOF
          {
            "BACKEND_BASE_URL": "${{ secrets.BACKEND_BASE_URL }}",
            "RABBITMQ_HOST": "${{ secrets.RABBITMQ_HOST }}",
            "RABBITMQ_PORT": ${{ secrets.RABBITMQ_PORT }},
            "RABBITMQ_USERNAME": "${{ secrets.RABBITMQ_USERNAME }}",
            "RABBITMQ_PASSWORD": "${{ secrets.RABBITMQ_PASSWORD }}",
            "PRODUCT_CREATED_EXCHANGE": "${{ secrets.PRODUCT_CREATED_EXCHANGE }}",
            "PRODUCT_CREATED_QUEUE": "${{ secrets.PRODUCT_CREATED_QUEUE }}",
            "PRODUCT_CREATED_ROUTING_KEY": "${{ secrets.PRODUCT_CREATED_ROUTING_KEY }}"
          }
          EOF

      - name: Create Android signing files
        run: |
          echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=$DART_DEFINE_FILE

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: barscan-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS release IPA
    runs-on: macos-latest
    needs: validate-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Dart define file
        run: |
          mkdir -p env
          cat > $DART_DEFINE_FILE <<EOF
          {
            "BACKEND_BASE_URL": "${{ secrets.BACKEND_BASE_URL }}",
            "RABBITMQ_HOST": "${{ secrets.RABBITMQ_HOST }}",
            "RABBITMQ_PORT": ${{ secrets.RABBITMQ_PORT }},
            "RABBITMQ_USERNAME": "${{ secrets.RABBITMQ_USERNAME }}",
            "RABBITMQ_PASSWORD": "${{ secrets.RABBITMQ_PASSWORD }}",
            "PRODUCT_CREATED_EXCHANGE": "${{ secrets.PRODUCT_CREATED_EXCHANGE }}",
            "PRODUCT_CREATED_QUEUE": "${{ secrets.PRODUCT_CREATED_QUEUE }}",
            "PRODUCT_CREATED_ROUTING_KEY": "${{ secrets.PRODUCT_CREATED_ROUTING_KEY }}"
          }
          EOF

      - name: Import Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install Apple provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PROFILE_PLIST=$RUNNER_TEMP/build_pp.plist
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Create export options
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ secrets.IOS_EXPORT_METHOD }}</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.IOS_BUNDLE_IDENTIFIER }}</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build IPA
        run: >
          flutter build ipa
          --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=$DART_DEFINE_FILE
          --export-options-plist=ios/ExportOptions.plist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: barscan-ios-release-ipa
          path: build/ios/ipa/*.ipa

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build-android
      - build-ios
    if: >
      always() &&
      needs.validate-release.result == 'success' &&
      (needs.build-android.result == 'success' || needs.build-ios.result == 'success')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release.outputs.release_tag }}
          name: Barscan ${{ needs.validate-release.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.ipa


