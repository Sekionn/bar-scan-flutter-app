name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release tag matches pubspec version
        if: github.ref_type == 'tag'
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          RELEASE_TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$RELEASE_TAG" ]; then
            echo "Release tag v$RELEASE_TAG does not match pubspec version $APP_VERSION."
            exit 1
          fi
      - name: Create Dart define file
        run: |
          mkdir -p env
          cat > env/ci.json <<EOF
          {
            "BACKEND_BASE_URL": "${{ secrets.BACKEND_BASE_URL }}",
            "RABBITMQ_HOST": "${{ secrets.RABBITMQ_HOST }}",
            "RABBITMQ_PORT": ${{ secrets.RABBITMQ_PORT }},
            "RABBITMQ_USERNAME": "${{ secrets.RABBITMQ_USERNAME }}",
            "RABBITMQ_PASSWORD": "${{ secrets.RABBITMQ_PASSWORD }}",
            "PRODUCT_CREATED_EXCHANGE": "${{ secrets.PRODUCT_CREATED_EXCHANGE }}",
            "PRODUCT_CREATED_QUEUE": "${{ secrets.PRODUCT_CREATED_QUEUE }}",
            "PRODUCT_CREATED_ROUTING_KEY": "${{ secrets.PRODUCT_CREATED_ROUTING_KEY }}"
          }
          EOF

      - name: Create Android signing files
        run: |
          echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=env/ci.json

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: barscan-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk




